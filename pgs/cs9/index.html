<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Minifier Online – Minify & Optimize CSS | Zyther Dev</title>
  <link rel="icon" href="../../assets/icons/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/utils/tailwind.cfg.js"></script>
  <link rel="stylesheet" href="../../css/styles.css">
  <link rel="stylesheet" href="../../css/themes/light.css" id="theme-stylesheet" />
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-body text-primary flex flex-col min-h-screen">
  <header id="main-header"></header>

  <div class="card">
    <h1>
      ⚡ Zyther Dev CSS Minifier
      <span>build</span>
    </h1>
    <div class="sub">Paste your CSS · minify in one click · copy the result</div>

    <div class="grid-2">
      <!-- input -->
      <div class="panel">
        <div class="panel-header">
          <label>📄 Input <span class="badge">CSS</span></label>
          <div class="stats" id="inputStats">chars <span id="inputCharCount">0</span></div>
        </div>
        <textarea id="inputCSS" placeholder="/* paste your CSS here */&#10;.container {&#10;  display: flex;&#10;  flex-direction: column;&#10;  padding: 2rem;&#10;}&#10;&#10;.btn {&#10;  background: #0b1e33;&#10;  color: white;&#10;  border-radius: 30px;&#10;}">
          .container {
            display: flex;
            flex-direction: column;
            padding: 2rem;
            background: #f7f9fc;
          }

          .btn {
            background: #0b1e33;
            color: white;
            border-radius: 30px;
            padding: 0.8rem 1.8rem;
            border: none;
            font-weight: 500;
            transition: 0.2s;
          }

          .btn:hover {
            background: #1a314b;
            transform: scale(1.02);
          }

          .card {
            max-width: 800px;
            margin: 2rem auto;
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.1);
            border-radius: 2rem;
            padding: 2rem;
          }
        </textarea>
        <div class="action-bar">
          <div class="btn-group">
            <button class="btn btn-primary" id="minifyBtn">⚡ Minify</button>
            <button class="btn btn-outline" id="clearBtn">✕ Clear</button>
          </div>
          <div class="stats" id="minifyStats">⚡ ready</div>
        </div>
      </div>

      <!-- output -->
      <div class="panel">
        <div class="panel-header">
          <label>📦 Minified <span class="badge badge-out">output</span></label>
          <div class="stats" id="outputStats">chars <span id="outputCharCount">0</span></div>
        </div>
        <textarea id="outputCSS" class="textarea-output" readonly placeholder="minified CSS will appear here …"></textarea>
        <div class="action-bar">
          <div class="btn-group">
            <button class="btn btn-primary" id="copyBtn">📋 Copy</button>
            <button class="btn btn-outline" id="sampleBtn">↺ Sample</button>
          </div>
          <span id="copyFeedback" class="copy-feedback">✓ copied</span>
        </div>
      </div>
    </div>
    <div class="footer">
      <span><code>CSS Minifier</code> — removes whitespace, comments, trailing semicolons &amp; more </span>
      <hr>
      <span>by <a href="https://github.com/zytherdev">@zytherdev</a></span>
    </div>
  </div>

  <footer id="main-footer"></footer>

  <script src="index.js"></script>
  <script src="../../js/utils/helpers.js"></script>
  <script src="../../js/theme.js"></script>
  <script src="../../js/utils/load.js"></script>
</body>
</html>
